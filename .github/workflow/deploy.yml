
name: Build and Deploy Angular Portfolio

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/gsap-portfolio
      - gsap/portfoli

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --base-href=/

      - name: Locate build output
        id: output
        shell: bash
        run: |
          INDEX=$(find dist -type f -name index.html -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: Angular index.html not found in dist/"
            exit 1
          fi

          BUILD_DIR=$(dirname "$INDEX")
          touch "$BUILD_DIR/.nojekyll"
          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          echo "Deploying Angular files from: $BUILD_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.output.outputs.path }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
