name: Deploy Angular Portfolio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy (leave empty to use selected branch above)'
        required: false
        default: ''
        type: string

  push:
    branches:
      - feature/gsap-portfolio
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href=/

      - name: Locate build output and prepare for GitHub Pages
        id: output
        shell: bash
        run: |
          INDEX=$(find dist -type f -name index.html -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: Angular index.html not found under dist/"
            exit 1
          fi

          BUILD_DIR=$(dirname "$INDEX")

          # Prevent Jekyll processing of special directories and assets
          touch "$BUILD_DIR/.nojekyll"

          # Fallback for client-side routing on GitHub Pages
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "Deploying Angular files from: $BUILD_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
